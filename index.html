<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soldier Map Game</title>

  <!-- Leaflet's stylesheet (makes the map, zoom buttons and popups look right) -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <!-- Our own styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The map will be drawn inside this empty box -->
  <div id="map"></div>

  <!-- Leaflet's JavaScript (the mapping library itself) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- Our own code. It must come AFTER Leaflet, because it uses Leaflet. -->
  <script src="main.js"></script>
</body>
</html>
