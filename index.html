<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soldier Map Game</title>

  <!-- Leaflet's stylesheet (makes the map, zoom buttons and popups look right) -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <!-- Our own styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The map will be drawn inside this empty box -->
  <div id="map"></div>

  <!-- Information panel that floats on top of the map -->
  <div id="info-panel">
    <div><strong>Soldier:</strong> <span id="soldier-position">-</span></div>
    <div><strong>Target:</strong> <span id="target-info">-</span></div>
    <button id="locate-button" type="button">Locate me</button>
    <div id="locate-status"></div>
    <div class="hint">Move with the arrow keys, or click the map to walk there.</div>
  </div>

  <!-- Details about the place where the soldier is standing -->
  <div id="place-panel">
    <div class="panel-title">Place details <span id="place-coords"></span></div>
    <dl>
      <dt>Elevation</dt>   <dd id="detail-elevation">-</dd>
      <dt>Weather now</dt> <dd id="detail-weather">-</dd>
      <dt>Climate</dt>     <dd id="detail-climate">-</dd>
      <dt>Soil</dt>        <dd id="detail-soil">-</dd>
      <dt>Land cover</dt>  <dd id="detail-landcover">-</dd>
      <dt>Wildlife</dt>    <dd id="detail-wildlife">-</dd>
    </dl>
    <div class="credits">
      Data: Open-Meteo · ISRIC SoilGrids · © OpenStreetMap contributors · GBIF
    </div>
  </div>

  <!-- Leaflet's JavaScript (the mapping library itself) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- Our own code. It must come AFTER Leaflet, because it uses Leaflet. -->
  <script src="main.js"></script>
</body>
</html>
