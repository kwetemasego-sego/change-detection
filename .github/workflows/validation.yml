# The full validation on all nine sites (about 2 to 5 minutes). It asks the
# free image service for a lot of data, so instead of on every push it runs every
# Monday, and whenever you start it by hand: Actions tab > Validation > Run workflow.
# The numbers for every site are saved as a downloadable file ("artifact").
name: Validation

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Puppeteer and its Chrome
        run: npm ci

      - name: Run all nine validation sites
        run: npm run test:validation

      - name: Save the numbers
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validation-results
          path: test-output/
